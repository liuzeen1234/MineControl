plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    id 'maven-publish'
}

// ---------------------------------------------------------------------------
// 同仓库 · 多 Minecraft 版本构建
//
//   ./gradlew build                 使用 default_mc（见 gradle.properties）
//   ./gradlew build -Pmc=1.20.1     构建 Minecraft 1.20.1
//   ./gradlew build -Pmc=1.20.4     构建 Minecraft 1.20.4
//   ./gradlew build -Pmc=26.2       构建 Minecraft 26.2
//   ./gradlew runClient             启动测试客户端（同样支持 -Pmc=<版本>）
//   ./gradlew runServer             启动测试服务端
//
// 每个目标版本的坐标集中维护在 supportedVersions，API 差异由版本源码适配。
// 产物名带上 MC 版本，因此不同目标的 jar 不会互相覆盖。
// ---------------------------------------------------------------------------
ext.supportedVersions = [
    '1.20.1': [ minecraft: '1.20.1', yarn: '1.20.1+build.10', loader: '0.15.11',
                fabricApi: '0.92.2+1.20.1', dependency: '~1.20.1', java: 17 ],
    '1.20.4': [ minecraft: '1.20.4', yarn: '1.20.4+build.3',  loader: '0.15.11',
                fabricApi: '0.97.1+1.20.4', dependency: '~1.20.4', java: 17 ],
    '26.2': [minecraft: '26.2', loader: '0.19.3', fabricApi: '0.161.0+26.2', dependency: '~26.2', java: 25],
]

def mcTarget = (project.findProperty('mc') ?: project.property('default_mc')).toString()
def target = supportedVersions[mcTarget]
if (target == null) {
    throw new GradleException("不支持的 Minecraft 版本: ${mcTarget}。可选: ${supportedVersions.keySet()}")
}

def modern = mcTarget == '26.2'
apply plugin: modern ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
layout.buildDirectory = file("build/targets/${mcTarget}")
// Share protocol/config code; isolate Minecraft APIs and mixins by version family.
sourceSets.main.java.setSrcDirs(modern ? ['src/mc26.2/java', 'src/common/java'] : ['src/main/java', 'src/common/java', "src/mc${mcTarget}/java"])

version = project.mod_version
group = project.maven_group

base {
    // 产物名带 MC 版本，使 1.20.1 与 1.20.4 的 jar 可共存于 build/libs，
    // 形如 fabric-mod-base-mc1.20.4-1.0.0.jar
    archivesName = "${project.archives_base_name}-mc${target.minecraft}"
}

repositories {
    // 需要额外仓库时在此添加
    mavenCentral()
}

dependencies {
    // 坐标来自上面选中的 target；修改版本请编辑 supportedVersions。
    minecraft "com.mojang:minecraft:${target.minecraft}"
    if (!modern) mappings "net.fabricmc:yarn:${target.yarn}:v2"
    add(modern ? "implementation" : "modImplementation", "net.fabricmc:fabric-loader:${target.loader}")

    // Fabric API
    add(modern ? "implementation" : "modImplementation", "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}")
}

// fabric.mod.json 里保留完整版本号（含游戏版本），便于在游戏内 mod 列表中辨认，
// 例如 1.0.0+mc1.20.4；jar 文件名则通过 archivesName 保持简洁。
def metadataVersion = "${project.mod_version}+mc${target.minecraft}"

processResources {
    // Discard obsolete generated resources, including macros from older builds.
    doFirst { delete destinationDir }
    dependsOn ':java-sdk:macroRuntimeJar'
    from(project(':java-sdk').layout.buildDirectory.file('libs/macro-runtime.jar')) {
        into 'minecontrol'
    }
    // version 与 minecraft 依赖范围按目标版本参数化。
    def props = [version: metadataVersion, minecraft_dependency: target.dependency, loader_dependency: ">=${target.loader}", java_dependency: ">=${target.java}", mixin_java: "JAVA_${target.java}",
        macro_input_mixins: modern ? ', "MacroKeyboardMixin", "MacroMouseMixin", "MacroOverlayMixin", "DamageEventMixin"' : ', "MacroKeyboardMixin", "MacroMouseMixin"']
    inputs.properties(props)

    filesMatching(["fabric.mod.json", "minecontrol.mixins.json"]) {
        expand(props)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = target.java
}

java {
    withSourcesJar()

    // 按目标选择编译 JDK；Gradle 本身需使用 Java 25。
    toolchain {
        languageVersion = JavaLanguageVersion.of(target.java)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Standalone protocol/config regression checks without extra test dependencies.
tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecontrol.ProtocolTest'
}
check.dependsOn protocolTest

loom {
    runs {
        client {
            runDir = (project.findProperty('runDir') ?: "run-${mcTarget}").toString()
        }
    }
}

// Keep all installable artifacts together while isolating target intermediates.
['sourcesJar', modern ? 'jar' : 'remapJar'].each { name ->
    tasks.named(name) { destinationDirectory = file('build/libs') }
}
if (!modern) tasks.named('remapSourcesJar') { destinationDirectory = file('build/libs') }

// Regression checks run via protocolTest, a standalone Java main, not JUnit.
tasks.named("test") { failOnNoDiscoveredTests = false }

// Opt-in in-client regression probe; never included in the installable Mod.
if (modern) {
    sourceSets {
        inputCaptureTest {
            java.srcDir 'src/mc26.2Test/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }
    tasks.register('inputCaptureTestJar', Jar) {
        dependsOn inputCaptureTestClasses
        archiveFileName = 'minecontrol-input-capture-test.jar'
        destinationDirectory = file('build/test-mods')
        from sourceSets.inputCaptureTest.output
        from 'src/mc26.2Test/resources'
    }
}

// Optional macros are separate deliverables, never resources inside the Mod.
tasks.named('assemble') { dependsOn ':java-sdk:macroProgramJar', ':java-sdk:blockDetectorJar' }

if (modern) {
    tasks.register('blockDetectionTypeTest', JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.minecontrol.BlockDetectionTypeTest'
    }
    check.dependsOn blockDetectionTypeTest
} else {
    sourceSets.test.java.exclude '**/BlockDetectionTypeTest.java'
}

// Explicit opt-in probe; excluded from the main Mod and normal client runs.
if (!modern) {
    sourceSets {
        legacyTest {
            java.srcDir 'src/legacyTest/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        }
    }
    tasks.register('legacyTestJar', Jar) {
        dependsOn legacyTestClasses
        archiveFileName = "minecontrol-legacy-test-mc${mcTarget}.jar"
        destinationDirectory = file('build/test-mods')
        from sourceSets.legacyTest.output
    }
}
