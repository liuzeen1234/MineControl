// Fabric 官方 maven 已清理旧版 Loom 的“插件标记”(gradle.plugin marker，仅保留 1.14+)，
// 导致 plugins { id 'fabric-loom' } 无法解析旧版本。改用 buildscript classpath 直接
// 引用真实构件 net.fabricmc:fabric-loom:<版本>（该 jar 仍然存在），再 apply 应用。
buildscript {
    repositories {
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.7.4'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

// ---------------------------------------------------------------------------
// 单源码 · 多 Minecraft 版本构建
//
//   ./gradlew build                 使用 default_mc（见 gradle.properties）
//   ./gradlew build -Pmc=1.20.1     构建 Minecraft 1.20.1
//   ./gradlew build -Pmc=1.20.4     构建 Minecraft 1.20.4
//   ./gradlew runClient             启动测试客户端（同样支持 -Pmc=<版本>）
//   ./gradlew runServer             启动测试服务端
//
// 每个目标版本的坐标集中维护在下面的 supportedVersions 里，新增版本只需在此
// 追加一行。产物名带上 MC 版本，因此不同目标的 jar 不会互相覆盖。
// ---------------------------------------------------------------------------
ext.supportedVersions = [
    '1.20.1': [ minecraft: '1.20.1', yarn: '1.20.1+build.10', loader: '0.15.11',
                fabricApi: '0.92.2+1.20.1', dependency: '~1.20.1' ],
    '1.20.4': [ minecraft: '1.20.4', yarn: '1.20.4+build.3',  loader: '0.15.11',
                fabricApi: '0.97.1+1.20.4', dependency: '~1.20.4' ],
]

def mcTarget = (project.findProperty('mc') ?: project.property('default_mc')).toString()
def target = supportedVersions[mcTarget]
if (target == null) {
    throw new GradleException("不支持的 Minecraft 版本: ${mcTarget}。可选: ${supportedVersions.keySet()}")
}

version = project.mod_version
group = project.maven_group

base {
    // 产物名带 MC 版本，使 1.20.1 与 1.20.4 的 jar 可共存于 build/libs，
    // 形如 fabric-mod-base-mc1.20.4-1.0.0.jar
    archivesName = "${project.archives_base_name}-mc${target.minecraft}"
}

repositories {
    // 需要额外仓库时在此添加
    mavenCentral()
}

dependencies {
    // 坐标来自上面选中的 target；修改版本请编辑 supportedVersions。
    minecraft "com.mojang:minecraft:${target.minecraft}"
    mappings "net.fabricmc:yarn:${target.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${target.loader}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
}

// fabric.mod.json 里保留完整版本号（含游戏版本），便于在游戏内 mod 列表中辨认，
// 例如 1.0.0+mc1.20.4；jar 文件名则通过 archivesName 保持简洁。
def metadataVersion = "${project.mod_version}+mc${target.minecraft}"

processResources {
    // version 与 minecraft 依赖范围按目标版本参数化。
    def props = [version: metadataVersion, minecraft_dependency: target.dependency]
    inputs.properties(props)

    filesMatching("fabric.mod.json") {
        expand(props)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    withSourcesJar()

    // 锁定构建所用的 JDK 为 17：Gradle 会自动查找已安装的 JDK 17，
    // 无需手动设置 JAVA_HOME 或依赖系统默认 JDK。
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Standalone protocol/config regression checks without extra test dependencies.
tasks.register('protocolTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecontrol.ProtocolTest'
}
check.dependsOn protocolTest

loom {
    runs {
        client {
            runDir = (project.findProperty('runDir') ?: 'run').toString()
        }
    }
}
