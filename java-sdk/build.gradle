plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.minecontrol'
version = rootProject.version
base { archivesName = 'minecontrol-sdk' }
repositories { mavenCentral() }
dependencies { api 'com.google.code.gson:gson:2.10' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
sourceSets {
    examples {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.examplesImplementation.extendsFrom configurations.implementation, configurations.api
tasks.named('check') { dependsOn tasks.named('examplesClasses') }
tasks.register('entityClick', JavaExec) {
    dependsOn examplesClasses
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'EntityClick'
    if (project.hasProperty('controlPort')) args project.property('controlPort')
}
tasks.register('macroProgramJar', Jar) {
    dependsOn examplesClasses
    archiveFileName = 'entity-click-program.jar'
    manifest { attributes 'Main-Class': 'EntityClick' }
    from(sourceSets.examples.output) { include 'EntityClick.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('macroRuntimeJar', Jar) {
    dependsOn classes
    archiveFileName = 'macro-runtime.jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('sdkTest', JavaExec) {
    dependsOn testClasses, examplesClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.examples.output
    mainClass = 'dev.minecontrol.sdk.SdkTest'
}
tasks.named('test') { enabled = false }
check.dependsOn sdkTest
tasks.register('smoke', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.minecontrol.sdk.Smoke'
    if (project.hasProperty('controlPort')) args project.property('controlPort')
}
tasks.register('liveInputCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecontrol.sdk.LiveInputCheck'
}
publishing {
    publications {
        sdk(MavenPublication) { from components.java }
    }
}
