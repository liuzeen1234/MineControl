plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.minecontrol'
version = rootProject.version
base { archivesName = 'minecontrol-sdk' }
repositories { mavenCentral() }
dependencies { api 'com.google.code.gson:gson:2.10' }
java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 17 }
sourceSets {
    examples {
        java.srcDir 'examples'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test { compileClasspath += sourceSets.examples.output }
}
configurations.examplesImplementation.extendsFrom configurations.implementation, configurations.api
tasks.named('check') { dependsOn tasks.named('examplesClasses') }
tasks.register('entityClick', JavaExec) {
    dependsOn examplesClasses
    classpath = sourceSets.examples.runtimeClasspath
    mainClass = 'EntityClick'
    if (project.hasProperty('controlPort')) args project.property('controlPort')
}
tasks.register('macroProgramJar', Jar) {
    dependsOn examplesClasses
    archiveFileName = 'entity-click-program.jar'
    manifest { attributes 'Main-Class': 'EntityClick' }
    from(sourceSets.examples.output) { include 'EntityClick.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('macroRuntimeJar', Jar) {
    dependsOn classes
    archiveFileName = 'macro-runtime.jar'
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('playerGuardJar', Jar) {
    dependsOn examplesClasses
    archiveFileName = 'player-guard.jar'
    manifest { attributes 'Main-Class': 'PlayerGuard' }
    from(sourceSets.examples.output) { include 'PlayerGuard.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('guardedEntityClickJar', Jar) {
    dependsOn examplesClasses
    archiveFileName = 'guarded-entity-click.jar'
    manifest { attributes 'Main-Class': 'GuardedEntityClick' }
    from(sourceSets.examples.output) { include 'GuardedEntityClick*.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('sdkTest', JavaExec) {
    dependsOn testClasses, examplesClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.examples.output
    mainClass = 'dev.minecontrol.sdk.SdkTest'
}
tasks.named('test') { enabled = false }
check.dependsOn sdkTest
tasks.register('smoke', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.minecontrol.sdk.Smoke'
    if (project.hasProperty('controlPort')) args project.property('controlPort')
}
tasks.register('liveInputCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.minecontrol.sdk.LiveInputCheck'
}
publishing {
    publications {
        sdk(MavenPublication) { from components.java }
    }
}

tasks.register('fishboneMiningJar', Jar) {
    dependsOn examplesClasses
    archiveFileName = 'fishbone-mining.jar'
    manifest { attributes 'Main-Class': 'FishboneMining' }
    from(sourceSets.examples.output) { include 'FishboneMining*.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}
tasks.register('fishboneMiningTest', JavaExec) {
    dependsOn testClasses, examplesClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.examples.output
    mainClass = 'FishboneMiningTest'
}
check.dependsOn fishboneMiningTest
tasks.register('fishboneMiningLiveCheck', JavaExec) {
    dependsOn testClasses, examplesClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.examples.output
    mainClass = 'FishboneMiningLiveCheck'
    args((project.findProperty('controlPort') ?: '25581').toString(),
            (project.findProperty('fishboneScenario') ?: 'cycle').toString())
    workingDir rootProject.projectDir
}
tasks.register('fishboneMiningLiveJar', Jar) {
    dependsOn testClasses, examplesClasses
    archiveFileName = 'fishbone-mining-live-test.jar'
    manifest { attributes 'Main-Class': 'FishboneMiningLiveCheck' }
    from(sourceSets.test.output) { include 'FishboneMiningLiveCheck*.class' }
    from(sourceSets.examples.output) { include 'FishboneMining*.class' }
    from sourceSets.main.output
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

tasks.register('blockDetectorTest', JavaExec) {
    dependsOn testClasses, examplesClasses
    classpath = sourceSets.test.runtimeClasspath + sourceSets.examples.output
    mainClass = 'BlockDetectorTest'
}
check.dependsOn blockDetectorTest
